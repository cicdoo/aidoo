     Aidoo horizontal wordmark — Spark Bubble icon + "aidoo". -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220">
  <defs>
    <linearGradient id="wm-bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8a5e7d"/>
      <stop offset="1" stop-color="#5d3d53"/>
    </linearGradient>
    <linearGradient id="wm-spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b5170"/>
      <stop offset="1" stop-color="#5f3f56"/>
    </linearGradient>
  </defs>

  <!-- icon (scaled 0.39 of the 512 app icon, padded) -->
  <g transform="translate(10,10) scale(0.39)">
    <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#wm-bg)"/>
    <path fill="#ffffff" d="M148 110 H364 A52 52 0 0 1 416 162 V268 A52 52 0 0 1 364 320
