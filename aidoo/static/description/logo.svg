    <path fill="url(#wm-spark)" d="M256 122 Q271 197 346 212 Q271 227 256 302
      Q241 227 166 212 Q241 197 256 122 Z"/>
    <path fill="url(#wm-spark)" opacity="0.92" d="M350 150 Q356 174 380 180
      Q356 186 350 210 Q344 186 320 180 Q344 174 350 150 Z"/>
  </g>

  <!-- wordmark -->
  <text x="232" y="148" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"
        font-size="150" font-weight="700" letter-spacing="-4" fill="#5d3d53">aidoo</text>
</svg>
